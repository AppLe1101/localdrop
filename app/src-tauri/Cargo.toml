[package]
name = "app"
version = "0.1.4"
description = "LocalDrop"
authors = ["ablochko"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ld-core = { path = "../../crates/ld-core" }
ld-crypto = { path = "../../crates/ld-crypto" }
ld-discovery = { path = "../../crates/ld-discovery" }
ld-transport = { path = "../../crates/ld-transport" }
ld-storage = { path = "../../crates/ld-storage" }
ld-web = { path = "../../crates/ld-web" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
quinn = { workspace = true }
dirs = { workspace = true }
hostname = "0.4"
clipboard-rs = "0.2"
